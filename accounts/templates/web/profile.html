{% extends "web/base.html" %}
{% load static %}
{% block title %}Perfil · LaaCLab{% endblock %}

{% block content %}
<!-- Cabeçalho da tela: ícone + título -->
<div class="d-flex align-items-center gap-3 mb-4">
  <div class="d-inline-flex align-items-center justify-content-center rounded-3 text-primary flex-shrink-0"
       style="width:48px;height:48px;background:rgba(var(--bs-primary-rgb), .15)">
    <span class="material-symbols-outlined" aria-hidden="true">person</span>
  </div>
  <div>
    <h1 class="h3 mb-0">Perfil</h1>
    <p class="text-secondary-emphasis small mb-0">Seus dados e sua atividade real na plataforma</p>
  </div>
</div>

<!-- Identidade: avatar, handle e bio -->
<div class="card mb-4">
  <div class="card-body d-flex align-items-center gap-4 flex-wrap">
    <div id="pf-avatar" class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold flex-shrink-0"
         style="width:96px;height:96px;font-size:32px">—</div>
    <div>
      <div class="h4 mb-1" id="pf-name">—</div>
      <p class="text-secondary-emphasis fst-italic mb-0" id="pf-bio">—</p>
    </div>
  </div>
</div>

<!-- Estatísticas reais: biblioteca, bugs reportados, confirmações, tópicos, comentários -->
<div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 mb-4" id="pf-stats"></div>

<!-- Jogos recentes: título com atalho para a biblioteca -->
<div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-3">
  <h2 class="h5 mb-0">Jogos recentes</h2>
  <a href="/biblioteca/" class="d-inline-flex align-items-center gap-2 fw-semibold small">
    Ver todos
    <span class="material-symbols-outlined" style="font-size:18px" aria-hidden="true">arrow_forward</span>
  </a>
</div>
<div class="card">
  <div class="list-group list-group-flush" id="pf-recent">
    <div class="list-group-item text-secondary-emphasis small text-center py-4">Carregando…</div>
  </div>
</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'web/js/profile.js' %}"></script>{% endblock %}
