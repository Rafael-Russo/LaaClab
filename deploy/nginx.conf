# nginx reverse proxy for LaaCLab (production, Linux).
# Django runs behind gunicorn on 127.0.0.1:8000; nginx terminates HTTP(S),
# serves static/media files directly and proxies everything else to gunicorn.
#
# Start the app server (from the project dir, venv active):
#   gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 3
# Collect static files first:
#   python manage.py collectstatic --noinput

upstream laaclab_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name laaclab.example.com;  # <- change to your domain

    client_max_body_size 10M;

    # Static files (run collectstatic first). Adjust the path to your deploy.
    location /static/ {
        alias /srv/laaclab/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /srv/laaclab/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://laaclab_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# For HTTPS, add a second server block on 443 with your TLS certs and set
# DJANGO_SECURE_SSL_REDIRECT=1 so Django enforces HTTPS behind the proxy.
