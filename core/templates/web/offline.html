{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e01e2b">
  <title>Você está offline · LaaCLab</title>
  <link rel="stylesheet" href="{% static 'web/vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'web/vendor/material-symbols/material-symbols.css' %}">
  <link rel="stylesheet" href="{% static 'web/css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'web/css/styles.css' %}">
</head>
<body>
<!-- Fallback shown by the service worker (sw.js) when a navigation fails
     while offline. Kept standalone (no navbar/sidebar, no /api/ fetches) so
     it always renders from the precache without depending on the network. -->
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="card text-center" style="max-width: 420px;">
    <div class="card-body p-4 p-md-5">
      <span class="material-symbols-outlined d-block mb-3 text-secondary-emphasis" style="font-size: 48px;" aria-hidden="true">wifi_off</span>
      <h1 class="h4 mb-2">Você está offline</h1>
      <p class="text-secondary-emphasis mb-4">Não foi possível conectar ao LaaCLab. Verifique sua conexão e tente novamente.</p>
      <button type="button" class="btn btn-primary" onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </div>
</div>
</body>
</html>
