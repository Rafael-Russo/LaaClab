{% extends "web/base.html" %}
{% load static %}
{% block title %}Detalhe do jogo · LaaCLab{% endblock %}

{% block content %}
<!-- Guarda o slug vindo do contexto do Django; o JS lê daqui e busca o endpoint -->
<div id="gd-root" data-slug="{{ slug }}"></div>

<div class="stack">
  <!-- Barra: nome do jogo ———— data da última atualização -->
  <div class="detail-bar" id="gd-bar">
    <span id="gd-name">—</span>
    <span class="dim">— — — — — — —</span>
    <span id="gd-update">—</span>
  </div>

  <!-- Hero com a capa (gradiente placeholder) e o título em maiúsculas -->
  <div class="detail-hero" id="gd-hero">
    <div>
      <div class="dh-title" id="gd-title">—</div>
      <div style="position:relative;z-index:2;font-size:13px;color:rgba(255,255,255,0.85)">Sobre</div>
    </div>
  </div>

  <!-- Abas: Sobre / Bugs & Alertas / Comunidade — trocadas por game_detail.js -->
  <div class="range-tabs" id="gd-tabs">
    <button type="button" data-tab="sobre" class="is-active">Sobre</button>
    <button type="button" data-tab="bugs">Bugs &amp; Alertas</button>
    <button type="button" data-tab="comunidade">Comunidade</button>
  </div>

  <!-- Aba Sobre: descrição, estatísticas, merch e comentários -->
  <div id="tab-sobre">
    <div class="with-rail">
      <!-- Coluna principal -->
      <div class="stack">
        <!-- Duas colunas: descrição à esquerda, estatísticas à direita -->
        <div style="display:grid;grid-template-columns:1fr 220px;gap:28px;align-items:start">
          <p class="muted" id="gd-about" style="margin:0;line-height:1.6">—</p>
          <div class="stack" id="gd-stats" style="gap:18px"></div>
        </div>
      </div>

      <!-- Trilho direito: merch e comentários -->
      <div class="rail">
        <div class="card">
          <b style="font-size:20px">Acesso ao merch:</b>
          <p class="muted" id="gd-merch" style="margin:10px 0 0">—</p>
        </div>

        <div class="card">
          <div class="section-title" style="text-align:center;margin-bottom:14px">Comentários</div>
          <div id="gd-comments"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Aba Bugs & Alertas: bugs ativos (com voto/moderação, do P4a) + alertas do jogo -->
  <div id="tab-bugs" hidden>
    <div class="with-rail">
      <div class="stack" id="gd-bugs-col"></div>

      <div class="rail">
        <div class="card">
          <div class="section-title">Alertas</div>
          <div id="gd-alerts" class="mt"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Aba Comunidade: tópicos do jogo + atalho para a comunidade -->
  <div id="tab-comunidade" hidden>
    <div class="card">
      <div class="row between" style="margin-bottom:14px">
        <div class="section-title">Tópicos da comunidade</div>
        <button class="btn btn--outline" id="gd-community-btn">Acesse a comunidade</button>
      </div>
      <div id="gd-topics" class="stack"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'web/js/game_detail.js' %}"></script>{% endblock %}
