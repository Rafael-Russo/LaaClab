{% extends "web/base.html" %}
{% load static %}
{% block title %}Início · LaaCLab{% endblock %}

{% block content %}
<div class="row g-4">

  <!-- Coluna principal: carrossel de destaque + atualizações + barra de alerta -->
  <div class="col-xl-8 d-flex flex-column gap-4">

    <!-- Carrossel de destaque (um slide por banner); fundo, título e
         indicadores são preenchidos via JS a partir do endpoint. -->
    <div class="carousel slide rounded-4" id="home-hero">
      <div class="carousel-indicators" id="hero-dots"></div>
      <div class="carousel-inner rounded-4" id="hero-inner"></div>
    </div>

    <!-- Grade de atualizações recentes: um card por item -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-3" id="home-updates"></div>

    <!-- Barra de alerta (mensagem preenchida via JS; dispensável e a
         dispensa é lembrada em localStorage) -->
    <div class="alert alert-danger d-flex align-items-center gap-3 mb-0 sticky-bottom shadow-sm" id="home-alert" role="alert">
      <span class="material-symbols-outlined fs-3 flex-shrink-0" aria-hidden="true">notifications_active</span>
      <div class="flex-grow-1 small" id="home-alert-msg"></div>
      <button type="button" class="btn btn-danger btn-sm flex-shrink-0" id="home-alert-btn">Ver alerta</button>
      <button type="button" class="btn-close flex-shrink-0" id="home-alert-dismiss" aria-label="Dispensar alerta"></button>
    </div>
  </div>

  <!-- Rail direita: assuntos em alta + jogos favoritos -->
  <div class="col-xl-4 d-flex flex-column gap-4">

    <!-- Assuntos em alta -->
    <div class="card">
      <h2 class="h6 text-center text-uppercase text-secondary-emphasis mb-3">Trending Topics</h2>
      <div id="home-trending"></div>
    </div>

    <!-- Jogos favoritos (estrela vermelha) -->
    <div class="card">
      <div class="d-flex align-items-center gap-2">
        <span class="material-symbols-outlined text-primary" aria-hidden="true">star</span>
        <span class="fw-bold">Jogos favoritos</span>
      </div>
      <div id="home-favorites" class="list-group list-group-flush mt-2"></div>
      <a href="{% url 'library' %}" class="d-block text-center fw-semibold small mt-3">Ver todos os jogos →</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'web/js/home.js' %}"></script>{% endblock %}
