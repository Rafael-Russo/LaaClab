{% extends "web/base.html" %}
{% load static %}
{% block title %}Bugômetro · LaaCLab{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
  <div class="d-flex align-items-center gap-3">
    <div id="bm-cover" class="cover" style="width:96px;height:64px"></div>
    <div>
      <h1 class="h3 mb-1" id="bm-name">—</h1>
      <span class="badge rounded-pill bg-stable-subtle d-inline-flex align-items-center gap-1" id="bm-updated">—</span>
    </div>
  </div>
  <button type="button" class="btn btn-outline-primary d-inline-flex align-items-center gap-2" id="bm-follow-btn">
    <span class="material-symbols-outlined" aria-hidden="true">favorite</span> Seguir
  </button>
</div>

<!-- gap-0 + align-items-stretch override a pre-existing legacy `.row { gap; align-items }`
     rule in styles.css that collides with Bootstrap's `.row` grid class (both are shared
     class names, styles.css loads last); without these !important utilities the two columns
     below would wrap onto separate lines instead of sitting side by side. -->
<div class="row g-4 mb-4 gap-0 align-items-stretch">
  <div class="col-lg-4">
    <div class="card h-100">
      <div class="card-body d-flex align-items-center justify-content-center">
        <div id="bm-gauge" class="gauge-wrap"><div class="skeleton">Carregando…</div></div>
      </div>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="row row-cols-1 row-cols-sm-2 g-3 h-100 gap-0 align-items-stretch" id="bm-metrics"></div>
  </div>
</div>

<div class="card mb-4">
  <div class="card-body">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-3">
      <h2 class="h6 mb-0 d-flex align-items-center gap-2">
        <span class="material-symbols-outlined" aria-hidden="true">schedule</span> Histórico de bug score
      </h2>
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <div class="d-flex gap-3 small text-secondary-emphasis" id="bm-legend"></div>
        <div class="btn-group btn-group-sm" role="group" id="bm-range" aria-label="Intervalo do gráfico">
          <button type="button" class="btn btn-outline-secondary" data-r="7">7d</button>
          <button type="button" class="btn btn-outline-secondary active" data-r="30">30d</button>
          <button type="button" class="btn btn-outline-secondary" data-r="90">90d</button>
        </div>
      </div>
    </div>
    <div id="bm-chart"></div>
    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-primary d-inline-flex align-items-center gap-2" id="bm-report-btn">
        <span class="material-symbols-outlined" aria-hidden="true">bug_report</span> Reportar um bug
      </button>
    </div>
  </div>
</div>

<div class="row g-4 gap-0 align-items-stretch">
  <div class="col-lg-7 col-xl-8">
    <div class="card h-100">
      <div class="card-body">
        <h2 class="h6 mb-3">Bugs reportados</h2>
        <div id="bm-bugs" class="d-flex flex-column gap-2"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-5 col-xl-4 d-flex flex-column gap-4">
    <div class="card">
      <div class="card-body">
        <h2 class="h6 mb-3">Atividade recente</h2>
        <div class="list-group list-group-flush" id="bm-activity"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <h2 class="h6 mb-3">Top jogos instáveis</h2>
        <div class="list-group list-group-flush" id="bm-top"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'web/js/bugometro.js' %}"></script>{% endblock %}
