{% extends "web/base.html" %}
{% load static %}
{% block title %}Bugômetro · LaaCLab{% endblock %}

{% block content %}
<div class="with-rail">
  <div class="stack">
    <div class="card" id="bm-panel">
      <div class="row between">
        <div class="row" style="gap:14px">
          <div id="bm-cover" class="cover" style="width:96px;height:64px"></div>
          <div id="bm-name" style="font-weight:800;font-size:20px">—</div>
        </div>
        <div class="row" style="gap:10px">
          <span class="badge badge--stable" id="bm-updated">—</span>
          <button class="btn btn--outline">♥ Seguir</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:minmax(240px,1fr) 1fr;gap:28px;margin-top:18px;align-items:center">
        <div class="gauge-wrap" id="bm-gauge"><div class="skeleton">Carregando…</div></div>
        <div class="grid-2" id="bm-metrics"></div>
      </div>
    </div>

    <div class="card chart-card">
      <div class="row between" style="flex-wrap:wrap;gap:12px">
        <b>🕒 Gráfico das últimas 24 horas</b>
        <div class="chart-legend" id="bm-legend"></div>
        <div class="range-tabs" id="bm-range">
          <button data-r="1h">1h</button>
          <button data-r="6h">6h</button>
          <button data-r="24h" class="is-active">24h</button>
          <button data-r="7d">7d</button>
        </div>
      </div>
      <div id="bm-chart" class="mt"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px">
        <button class="btn btn--primary" id="bm-report-btn">🐞 Reportar um bug</button>
      </div>
    </div>
  </div>

  <div class="rail">
    <div class="card">
      <div class="row between"><b>Atividade recentes</b></div>
      <div id="bm-activity" class="mt"></div>
    </div>
    <div class="card">
      <div class="section-title">Top jogos instáveis</div>
      <div id="bm-top" class="mt"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'web/js/bugometro.js' %}"></script>{% endblock %}
