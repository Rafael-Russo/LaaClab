{% extends "web/base.html" %}
{% load static %}
{% block title %}Históricos · LaaCLab{% endblock %}

{% block content %}
<!-- Históricos: série temporal do bug score de um jogo da biblioteca do usuário. -->
<div class="page-head">
  <div class="icon-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4M12 8v4l3 2"/></svg>
  </div>
  <div>
    <h1>Históricos</h1>
    <p>Evolução do bug score dos jogos da sua biblioteca</p>
  </div>
</div>

<div id="hi-empty" class="card" hidden>
  <div class="muted">Adicione jogos à biblioteca para ver históricos.</div>
</div>

<div id="hi-body" class="card chart-card" hidden>
  <div class="row between" style="flex-wrap:wrap;gap:12px">
    <select id="hi-game" style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text)"></select>
    <div class="range-tabs" id="hi-range">
      <button data-r="7">7d</button>
      <button data-r="30" class="is-active">30d</button>
      <button data-r="90">90d</button>
    </div>
  </div>
  <div id="hi-chart" class="mt"></div>
</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'web/js/historicos.js' %}"></script>{% endblock %}
