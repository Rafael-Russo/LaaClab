<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuração · LaaCLab</title>
  <link rel="stylesheet" href="/estatico/css/estilos.css">
</head>
<body data-tela="configuracao">
<!-- CASCA:INICIO -->
<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" style="color: var(--brand)">
        <path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3L14 9V3"/>
        <path d="M7.5 15h9"/>
      </svg>
      <span>LaaC<span style="color:var(--brand)">Lab</span></span>
    </div>

    <nav class="nav">
      <a class="nav-item" data-tela="inicio" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        Início
      </a>
      <a class="nav-item" data-tela="biblioteca" href="/biblioteca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M7 11v4M5 13h4M15 12h.01M18 15h.01"/></svg>
        Meus jogos
      </a>
      <a class="nav-item" data-tela="explorar" href="/explorar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Explorar
      </a>
      <a class="nav-item" data-tela="bugometro" href="/bugometro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6 6.5 4.5M16 6l1.5-1.5M12 8a5 5 0 0 1 5 5v3a5 5 0 0 1-10 0v-3a5 5 0 0 1 5-5Z"/><path d="M2 13h5M17 13h5M4 18h3M17 18h3M12 8V5"/></svg>
        BugoMetro
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4M12 8v4l3 2"/></svg>
        Históricos
      </a>
      <a class="nav-item" data-tela="alertas" href="/alertas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.7 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3l-8.5-14.3a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
        Alertas
      </a>
      <a class="nav-item" data-tela="comunidade" href="/comunidade">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 20v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 20v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
        Comunidade
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a class="nav-item" href="/configuracao" data-tela="configuracao">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
        Configuração
      </a>
      <div class="level-card">
        <div class="who">
          <div class="flame">🔥</div>
          <div>
            <div style="font-weight:700"><span id="sb-nome">—</span></div>
            <div class="lvl" id="sb-nivel">Nível —</div>
          </div>
        </div>
        <div class="progress"><span id="sb-xp-barra" style="width:0"></span></div>
        <div class="xp" id="sb-xp">— / — XP</div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" placeholder="Buscar jogos..." aria-label="Buscar">
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Notificações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
        <button class="icon-btn" id="alternar-tema" aria-label="Alternar tema">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <a class="avatar js-avatar" href="/perfil" title="Perfil">GP</a>
      </div>
    </header>

<!-- CASCA:FIM -->
    <main class="page" id="conteudo">
      <div class="page-head">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
        </div>
        <div>
          <h1>Configuração</h1>
          <p>Gerencie seu perfil e sua senha.</p>
        </div>
      </div>

      <div id="cf-status"></div>

      <div class="grid-2">
        <div class="card">
          <div class="section-title">Perfil</div>
          <div class="err" id="cf-erro-perfil" style="color:var(--critical);font-size:12px;margin-top:8px" hidden></div>
          <div class="estado" id="cf-sucesso-perfil" style="text-align:left;padding:0;margin-top:8px" hidden></div>

          <form id="form-perfil" method="post" novalidate style="display:flex;flex-direction:column;gap:14px;margin-top:14px">
            <div>
              <label for="apelido" style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:6px">Apelido</label>
              <input type="text" name="apelido" id="apelido" maxlength="50"
                     style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit">
              <div class="err" id="erro-apelido" style="color:var(--critical);font-size:12px;margin-top:4px"></div>
            </div>
            <div>
              <label for="bio" style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:6px">Bio</label>
              <textarea name="bio" id="bio" maxlength="280" rows="3"
                        style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit;resize:vertical"></textarea>
              <div class="err" id="erro-bio" style="color:var(--critical);font-size:12px;margin-top:4px"></div>
            </div>
            <div>
              <label for="idade" style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:6px">Idade</label>
              <input type="number" name="idade" id="idade" min="0" step="1"
                     style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit">
              <div class="helptext" style="color:var(--text-dim);font-size:11px;margin-top:4px">Deixe em branco para não informar.</div>
              <div class="err" id="erro-idade" style="color:var(--critical);font-size:12px;margin-top:4px"></div>
            </div>
            <button type="submit" class="btn btn--primary">Salvar perfil</button>
          </form>
        </div>

        <div class="card">
          <div class="section-title">Senha</div>
          <div class="err" id="cf-erro-senha" style="color:var(--critical);font-size:12px;margin-top:8px" hidden></div>
          <div class="estado" id="cf-sucesso-senha" style="text-align:left;padding:0;margin-top:8px" hidden></div>

          <form id="form-senha" method="post" novalidate style="display:flex;flex-direction:column;gap:14px;margin-top:14px">
            <div>
              <label for="senha_atual" style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:6px">Senha atual</label>
              <input type="password" name="senha_atual" id="senha_atual" autocomplete="current-password" required
                     style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit">
              <div class="err" id="erro-senha_atual" style="color:var(--critical);font-size:12px;margin-top:4px"></div>
            </div>
            <div>
              <label for="senha_nova" style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:6px">Nova senha</label>
              <input type="password" name="senha_nova" id="senha_nova" autocomplete="new-password" required minlength="8" maxlength="128"
                     style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit">
              <div class="helptext" style="color:var(--text-dim);font-size:11px;margin-top:4px">De 8 a 128 caracteres.</div>
              <div class="err" id="erro-senha_nova" style="color:var(--critical);font-size:12px;margin-top:4px"></div>
            </div>
            <button type="submit" class="btn btn--primary">Trocar senha</button>
          </form>
        </div>
      </div>
    </main>
<!-- CASCA:RODAPE:INICIO -->
  </div>
</div>
<!-- CASCA:RODAPE:FIM -->
<script src="/estatico/js/api.js"></script>
<script src="/estatico/js/casca.js"></script>
<script src="/estatico/js/configuracao.js"></script>
</body>
</html>
