<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta · LaaCLab</title>
  <link rel="stylesheet" href="/estatico/css/estilos.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .auth {
      width: 100%; max-width: 400px;
      background: var(--surface); border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow);
    }
    .auth .brand { justify-content: center; font-size: 24px; padding-bottom: 8px; }
    .auth .brand svg { width: 34px; height: 34px; color: var(--brand); }
    .auth h1 { font-size: 20px; margin: 8px 0 4px; text-align: center; }
    .auth .sub { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
    .auth form { display: flex; flex-direction: column; gap: 14px; }
    .auth label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; }
    .auth input {
      width: 100%; padding: 11px 14px; border-radius: var(--radius-sm);
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      font-size: 14px; outline: none;
    }
    .auth input:focus { border-color: var(--brand); }
    .auth .btn { justify-content: center; width: 100%; margin-top: 4px; }
    .auth .alt { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted); }
    .auth .alt a { color: var(--brand); font-weight: 700; }
    .auth .err { color: var(--critical); font-size: 12px; margin-top: 4px; }
    .auth .helptext { color: var(--text-dim); font-size: 11px; }
    .auth ul.errorlist { list-style: none; padding: 0; margin: 0 0 8px; }
    .auth ul.errorlist li { color: var(--critical); font-size: 13px; }
    .auth .checkbox { display: flex; align-items: center; gap: 8px; }
    .auth .checkbox input { width: auto; }
  </style>
</head>
<body data-tela="registro" data-casca="auth">
<!-- CASCA:INICIO -->
  <div class="auth">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7.5 15h9"/>
      </svg>
      <span>LaaC<span style="color:var(--brand)">Lab</span></span>
    </div>
    <div id="conteudo">
      <h1>Criar conta</h1>
      <p class="sub">Junte-se à comunidade do Bugômetro.</p>

      <div class="err" id="erro-geral" hidden></div>

      <form id="form-registro" novalidate>
        <div>
          <label for="nome_usuario">Nome de usuário</label>
          <input type="text" name="nome_usuario" id="nome_usuario" autocomplete="username" required minlength="3">
          <div class="helptext">Mínimo de 3 caracteres.</div>
          <div class="err" id="erro-nome_usuario"></div>
        </div>
        <div>
          <label for="email">E-mail</label>
          <input type="email" name="email" id="email" autocomplete="email" required>
          <div class="err" id="erro-email"></div>
        </div>
        <div>
          <label for="senha">Senha</label>
          <input type="password" name="senha" id="senha" autocomplete="new-password" required minlength="8">
          <div class="helptext">Mínimo de 8 caracteres.</div>
          <div class="err" id="erro-senha"></div>
        </div>
        <button type="submit" class="btn btn--primary">Criar conta</button>
      </form>

      <p class="alt">Já tem conta? <a href="/login">Entrar</a></p>
    </div>
  </div>
<!-- CASCA:FIM -->
<script src="/estatico/js/api.js"></script>
<script src="/estatico/js/casca.js"></script>
<script src="/estatico/js/registro.js"></script>
</body>
</html>
