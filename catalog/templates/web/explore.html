{% extends "web/base.html" %}
{% load static %}
{% block title %}Explorar · LaaCLab{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <div class="d-inline-flex align-items-center justify-content-center rounded-3 text-primary flex-shrink-0"
       style="width:48px;height:48px;background:rgba(var(--bs-primary-rgb), .15)">
    <span class="material-symbols-outlined" aria-hidden="true">grid_view</span>
  </div>
  <div>
    <h1 class="h3 mb-0">Explorar</h1>
    <p class="text-secondary-emphasis small mb-0">Descubra jogos e adicione à sua biblioteca</p>
  </div>
</div>

<form class="row g-2 align-items-center mb-4" role="search" onsubmit="return false;">
  <div class="col-12 col-md">
    <div class="input-group">
      <span class="input-group-text bg-body-tertiary">
        <span class="material-symbols-outlined" style="font-size:18px" aria-hidden="true">search</span>
      </span>
      <input id="ex-search" type="search" class="form-control" placeholder="Buscar jogos..." aria-label="Buscar jogos">
    </div>
  </div>
  <div class="col-6 col-md-auto">
    <select id="ex-genre" class="form-select" aria-label="Filtrar por gênero"></select>
  </div>
  <div class="col-6 col-md-auto">
    <select id="ex-order" class="form-select" aria-label="Ordenar">
      <option value="-popularity">Mais populares</option>
      <option value="-bug_score">Mais instáveis</option>
      <option value="name">Nome (A–Z)</option>
    </select>
  </div>
</form>

<div class="row row-cols-2 row-cols-md-3 row-cols-xl-5 g-3" id="ex-grid">
  <div class="col-12 text-secondary-emphasis small py-4">Carregando…</div>
</div>
<div class="text-center mt-4">
  <button id="ex-more" class="btn btn-outline-primary d-none" type="button">Carregar mais</button>
</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'web/js/explore.js' %}"></script>{% endblock %}
