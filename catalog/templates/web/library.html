{% extends "web/base.html" %}
{% load static %}
{% block title %}Minha Biblioteca · LaaCLab{% endblock %}

{% block content %}
<!-- Biblioteca: full-width grid of every game the user follows. -->
<div class="d-flex align-items-center gap-3 mb-4">
  <div class="d-inline-flex align-items-center justify-content-center rounded-3 text-primary flex-shrink-0"
       style="width:48px;height:48px;background:rgba(var(--bs-primary-rgb), .15)">
    <span class="material-symbols-outlined" aria-hidden="true">sports_esports</span>
  </div>
  <div>
    <h1 class="h3 mb-0">Minha Biblioteca</h1>
    <p class="text-secondary-emphasis small mb-0">Todos os jogos que você adicionou ao Bugômetro</p>
  </div>
</div>

<!-- Filtro (chip "Todos" + chips de gênero) à esquerda e ordenação à direita. -->
<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4" id="lib-toolbar">
  <div class="d-flex flex-wrap gap-2" id="lib-filters"></div>
  <select id="lib-order" class="form-select w-auto" aria-label="Ordenar">
    <option value="recent">Ordenar: Recentes</option>
    <option value="name">Ordenar: Nome</option>
    <option value="score">Ordenar: Score</option>
  </select>
</div>

<div class="row row-cols-2 row-cols-md-3 row-cols-xl-5 g-3" id="lib-grid">
  <div class="col-12 text-secondary-emphasis small py-4">Carregando…</div>
</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'web/js/library.js' %}"></script>{% endblock %}
