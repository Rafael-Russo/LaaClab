{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block head_title %}Acesso{% endblock %} · LaaCLab</title>
  <link rel="stylesheet" href="{% static 'web/vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'web/vendor/material-symbols/material-symbols.css' %}">
  <link rel="stylesheet" href="{% static 'web/css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'web/css/styles.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="card shadow-sm" style="width: 100%; max-width: 420px; margin: 24px;">
    <div class="card-body p-4">
      <div class="d-flex align-items-center justify-content-center gap-2 fw-bold fs-4 mb-3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" width="30" height="30" class="text-primary">
          <path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3L14 9V3"/>
          <path d="M7.5 15h9"/>
        </svg>
        <span>LaaC<span class="text-primary">Lab</span></span>
      </div>
      {% block content %}{% endblock %}
    </div>
  </div>
  <script src="{% static 'web/vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
