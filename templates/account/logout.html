{% extends "account/base.html" %}
{% block head_title %}Sair{% endblock %}

{% block content %}
<h1 class="h4 text-center mb-1">Sair da conta</h1>
<p class="text-center text-body-secondary mb-4">Tem certeza que deseja encerrar a sessão?</p>

<form id="logout-form" method="post" action="{% url 'account_logout' %}">
  {% csrf_token %}
  {% if redirect_field_value %}
    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
  {% endif %}
  <button type="submit" class="btn btn-primary w-100">Sair</button>
</form>

<p class="text-center text-body-secondary mt-3 mb-0"><a href="{% url 'home' %}">Voltar ao início</a></p>

<script>
  // Standalone auth page (doesn't load app.js): drop the SW's cached /api/
  // responses right as the user confirms logout, so a shared machine never
  // serves the previous user's data from the stale-while-revalidate cache.
  if ("serviceWorker" in navigator) {
    var form = document.getElementById("logout-form");
    form.addEventListener("submit", function () {
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg && reg.active) reg.active.postMessage({ type: "clear-cache" });
      }).catch(function () {});
    });
  }
</script>
{% endblock %}
