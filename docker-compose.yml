# Dev stack: MySQL + the Django app. Bring it up with `docker compose up --build`.
# The app waits for MySQL, migrates, collects static and seeds on start.
services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: laaclab
      MYSQL_USER: laaclab
      MYSQL_PASSWORD: laaclab
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulaaclab", "-plaaclab"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    # Dev server with autoreload; the image's default CMD is gunicorn (prod).
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DATABASE_URL: "mysql://laaclab:laaclab@db:3306/laaclab"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "dev-compose-secret-change-me"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      PYTHONUNBUFFERED: "1"
      # Dev serves static via runserver; skip collectstatic (fails on bind mount).
      COLLECTSTATIC: "0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      # Mount source for live reload in development.
      - .:/app
      - media:/app/media

  worker:
    build: .
    command: celery -A config worker -l info
    environment:
      DATABASE_URL: "mysql://laaclab:laaclab@db:3306/laaclab"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "dev-compose-secret-change-me"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      PYTHONUNBUFFERED: "1"
      SEED_ON_START: "0"
      # web applies migrations and collects static; skip both here to avoid
      # a migrate race and collectstatic failing on the bind-mounted source.
      MIGRATE: "0"
      COLLECTSTATIC: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - media:/app/media

  beat:
    build: .
    command: celery -A config beat -l info
    profiles: ["beat"]
    environment:
      DATABASE_URL: "mysql://laaclab:laaclab@db:3306/laaclab"
      DJANGO_SECRET_KEY: "dev-compose-secret-change-me"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      SEED_ON_START: "0"
      MIGRATE: "0"
      COLLECTSTATIC: "0"
    depends_on:
      redis:
        condition: service_started

volumes:
  mysql_data:
  media:
