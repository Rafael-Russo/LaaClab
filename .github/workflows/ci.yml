name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: pytest e ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          # Igual ao piso declarado em pyproject.toml (target-version = py310).
          python-version: "3.10"
          cache: pip

      - name: Instalar as dependencias
        run: pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: pytest

      - name: Rodar o lint
        run: ruff check .

  javascript:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          # O --test so expande o glob de tests_js/ a partir do Node 22.
          node-version: "22"

      # Sem npm ci de proposito: o package.json tem zero dependencias e nao ha
      # lockfile — os assets sao vendorados, nao instalados.
      - name: Rodar os testes
        run: npm test
