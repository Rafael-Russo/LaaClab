name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: laaclab
          MYSQL_USER: laaclab
          MYSQL_PASSWORD: laaclab
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Root can create the test_ database the Django test runner needs.
      DATABASE_URL: "mysql://root:rootpass@127.0.0.1:3306/laaclab"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-secret-key"
      # Fake classifier: never loads fastembed or downloads a model in CI.
      BUGS_CLASSIFIER: "fake"
      # Config da suíte Flask: SQLite em memória, sem MySQL nem Redis.
      APP_CONFIG: "test"
      SECRET_KEY: "ci-secret-key"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries (mysqlclient)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev build-essential pkg-config

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test -v2

      - name: Run Flask tests (pytest)
        run: pytest

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: laaclab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
